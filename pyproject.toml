[project]
name = "dap-viz"
version = "0.1.0"
description = "Dash viewer for JET DAP key/value control-parameter files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.5.0",
    "dash-ag-grid>=35.3.0",
    "dash-bootstrap-components>=2.0.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.pytest.ini_options]
addopts = "-p no:dash"
